<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piggy Bank — Dev Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');

:root{
  --bg:#fff7fb;
  --card:#ffffff;
  --text:#241b29;
  --muted:#817785;
  --pink:#f5b7d2;
  --pink-dark:#d96b9c;
  --purple:#8f7acb;
  --border:#eadfe8;
  --green:#65b98a;
  --shadow:0 10px 30px rgba(90,55,80,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}

.container{
  width:min(1100px, calc(100% - 32px));
  margin:auto;
}

header{
  padding:28px 0 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:16px;
  background:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

h1{
  margin:0;
  font-family:'Playfair Display',serif;
  font-size:28px;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
}

.dev-badge{
  background:#211c24;
  color:white;
  padding:8px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
}

button{
  border:0;
  background:#211c24;
  color:white;
  padding:12px 17px;
  border-radius:13px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:25px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.stat-value{
  font-size:28px;
  font-weight:800;
  margin-top:7px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0 13px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.updated{
  color:var(--muted);
  font-size:12px;
}

.club{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.club-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.club-name{
  font-size:20px;
  font-weight:800;
}

.club-goal{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.invite{
  background:#f7edf3;
  padding:8px 11px;
  border-radius:10px;
  font-weight:800;
  font-size:13px;
  letter-spacing:.08em;
}

.progress-wrap{
  margin:18px 0;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.progress{
  height:10px;
  background:#eee6ed;
  border-radius:99px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--pink-dark),var(--purple));
  border-radius:99px;
}

.details{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}

.detail{
  background:#fbf7fa;
  border-radius:14px;
  padding:12px;
}

.detail-label{
  color:var(--muted);
  font-size:11px;
}

.detail-value{
  font-weight:800;
  margin-top:3px;
}

.members{
  border-top:1px solid var(--border);
  padding-top:16px;
}

.members-title{
  font-weight:800;
  margin-bottom:10px;
}

.member{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 0;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.member-name{
  font-weight:700;
}

.member-role{
  color:var(--muted);
  font-size:11px;
}

.contributions{
  margin-top:16px;
  border-top:1px solid var(--border);
  padding-top:16px;
}

.contribution{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  font-size:13px;
}

.contribution-left{
  display:flex;
  gap:8px;
  align-items:center;
}

.contribution-name{
  font-weight:700;
}

.contribution-date{
  color:var(--muted);
  font-size:11px;
}

.amount{
  font-weight:800;
}

.empty{
  background:white;
  border:1px dashed var(--border);
  border-radius:20px;
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.loading{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.error{
  background:#fff0f0;
  color:#a33;
  border:1px solid #f2cccc;
  border-radius:15px;
  padding:15px;
  margin-bottom:20px;
  font-size:13px;
}

@media(max-width:700px){

  header{
    align-items:flex-start;
  }

  .dev-badge{
    font-size:9px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .details{
    grid-template-columns:repeat(2,1fr);
  }

  .club-top{
    flex-direction:column;
  }

  .invite{
    align-self:flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="brand">
    <div class="logo">🐷</div>

    <div>
      <h1>Piggy Bank</h1>
      <div class="subtitle">Developer Dashboard</div>
    </div>
  </div>

  <div class="dev-badge">DEV ONLY</div>
</header>

<div id="error"></div>

<div class="stats">

  <div class="stat">
    <div class="stat-label">Clubs</div>
    <div class="stat-value" id="clubCount">—</div>
  </div>

  <div class="stat">
    <div class="stat-label">Members</div>
    <div class="stat-value" id="memberCount">—</div>
  </div>

  <div class="stat">
    <div class="stat-label">Contributions</div>
    <div class="stat-value" id="contributionCount">—</div>
  </div>

  <div class="stat">
    <div class="stat-label">Saved</div>
    <div class="stat-value" id="savedAmount">—</div>
  </div>

</div>

<div class="section-title">
  <h2>All Clubs</h2>

  <div style="display:flex;align-items:center;gap:10px;">
    <span class="updated" id="updated"></span>
    <button onclick="loadDashboard()">Refresh</button>
  </div>
</div>

<div id="clubs">
  <div class="loading">Loading Piggy Bank data…</div>
</div>

</div>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://hyzgpwnfbcglzgmthhcr.supabase.co";

/*
  IMPORTANT:
  Paste your EXISTING Supabase publishable key here.
  Do not create a new key just for this dashboard.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_m5EYoQSXmDC5q9MeLtuJ7Q_ZNN6v8JS";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================
   HELPERS
========================================= */

function money(value){

  return "R" + Number(value || 0).toLocaleString(
    "en-ZA",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(date){

  if(!date) return "";

  return new Date(date + "T00:00:00")
    .toLocaleDateString(
      "en-ZA",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

}


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard(){

  const errorBox =
    document.getElementById("error");

  errorBox.innerHTML = "";

  document.getElementById("clubs").innerHTML =
    '<div class="loading">Loading Piggy Bank data…</div>';

  try{

    const [
      clubsResult,
      membersResult,
      contributionsResult
    ] = await Promise.all([

      supabaseClient
        .from("Clubs")
        .select("*")
        .order("created_at",{ascending:false}),

      supabaseClient
        .from("Club Members")
        .select("*")
        .order("created_at",{ascending:true}),

      supabaseClient
        .from("Contributions")
        .select("*")
        .order("created_at",{ascending:false})

    ]);


    if(clubsResult.error)
      throw clubsResult.error;

    if(membersResult.error)
      throw membersResult.error;

    if(contributionsResult.error)
      throw contributionsResult.error;


    const clubs = clubsResult.data || [];
    const members = membersResult.data || [];
    const contributions =
      contributionsResult.data || [];


    /* ===============================
       TOP STATS
    =============================== */

    const totalSaved =
      contributions.reduce(
        (sum,c) => sum + Number(c.amount || 0),
        0
      );


    document.getElementById("clubCount")
      .textContent = clubs.length;

    document.getElementById("memberCount")
      .textContent = members.length;

    document.getElementById("contributionCount")
      .textContent = contributions.length;

    document.getElementById("savedAmount")
      .textContent = money(totalSaved);


    document.getElementById("updated")
      .textContent =
      "Updated " +
      new Date().toLocaleTimeString(
        "en-ZA",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );


    /* ===============================
       NO CLUBS
    =============================== */

    if(!clubs.length){

      document.getElementById("clubs").innerHTML =
        `<div class="empty">
          🐷 No clubs yet.<br><br>
          Create your first Piggy Bank club.
        </div>`;

      return;
    }


    /* ===============================
       BUILD CLUB CARDS
    =============================== */

    document.getElementById("clubs").innerHTML =
      clubs.map(club => {

        const clubMembers =
          members.filter(
            member =>
              Number(member.club_id) === Number(club.id)
          );


        const clubContributions =
          contributions.filter(
            contribution =>
              Number(contribution.club_id) === Number(club.id)
          );


        const saved =
          clubContributions.reduce(
            (sum,c) =>
              sum + Number(c.amount || 0),
            0
          );


        const goal =
          Number(club["Goal"] || 0);


        const percentage =
          goal > 0
            ? Math.min((saved / goal) * 100,100)
            : 0;


        const outstanding =
          Math.max(goal - saved,0);


        return `

          <div class="club">

            <div class="club-top">

              <div>

                <div class="club-name">
                  ${escapeHTML(
                    club["Name"] || "Unnamed Club"
                  )}
                </div>

                <div class="club-goal">

                  Saving for:
                  <strong>
                    ${escapeHTML(
                      club["Saving for"] || "—"
                    )}
                  </strong>

                </div>

              </div>

              <div class="invite">

                ${escapeHTML(
                  club["Invite Code"] || "—"
                )}

              </div>

            </div>


            <div class="progress-wrap">

              <div class="progress-info">

                <span>
                  ${money(saved)} saved
                </span>

                <span>
                  ${percentage.toFixed(0)}%
                </span>

              </div>

              <div class="progress">

                <div
                  class="progress-bar"
                  style="width:${percentage}%"
                ></div>

              </div>

            </div>


            <div class="details">

              <div class="detail">

                <div class="detail-label">
                  Goal
                </div>

                <div class="detail-value">
                  ${money(goal)}
                </div>

              </div>


              <div class="detail">

                <div class="detail-label">
                  Members
                </div>

                <div class="detail-value">
                  ${clubMembers.length}
                </div>

              </div>


              <div class="detail">

                <div class="detail-label">
                  Contribution
                </div>

                <div class="detail-value">
                  ${money(
                    club["Contribution Amount"]
                  )}
                </div>

              </div>


              <div class="detail">

                <div class="detail-label">
                  Outstanding
                </div>

                <div class="detail-value">
                  ${money(outstanding)}
                </div>

              </div>

            </div>


            <div class="members">

              <div class="members-title">
                Members
              </div>

              ${
                clubMembers.length
                  ? clubMembers.map(member => `

                    <div class="member">

                      <div class="avatar">
                        ${escapeHTML(
                          member.avatar || "🐷"
                        )}
                      </div>

                      <div>

                        <div class="member-name">
                          ${escapeHTML(
                            member.name || "Unnamed"
                          )}
                        </div>

                        <div class="member-role">
                          ${escapeHTML(
                            member.role || "member"
                          )}
                        </div>

                      </div>

                    </div>

                  `).join("")
                  :
                  `<div style="color:var(--muted);font-size:13px;">
                    No members yet.
                  </div>`
              }

            </div>


            <div class="contributions">

              <div class="members-title">
                Recent Contributions
              </div>

              ${
                clubContributions.length
                  ? clubContributions
                      .slice(0,10)
                      .map(contribution => {

                        const member =
                          clubMembers.find(
                            m =>
                              Number(m.id) ===
                              Number(
                                contribution.member_id
                              )
                          );

                        return `

                          <div class="contribution">

                            <div class="contribution-left">

                              <div class="avatar">
                                ${escapeHTML(
                                  member?.avatar || "🐷"
                                )}
                              </div>

                              <div>

                                <div class="contribution-name">
                                  ${escapeHTML(
                                    member?.name ||
                                    "Unknown member"
                                  )}
                                </div>

                                <div class="contribution-date">

                                  ${
                                    contribution.contribution_date
                                      ? formatDate(
                                          contribution.contribution_date
                                        )
                                      : formatDate(
                                          contribution.created_at
                                            ?.slice(0,10)
                                        )
                                  }

                                </div>

                              </div>

                            </div>

                            <div class="amount">
                              +${money(
                                contribution.amount
                              )}
                            </div>

                          </div>

                        `;

                      }).join("")
                  :
                  `<div style="color:var(--muted);font-size:13px;">
                    No contributions yet.
                  </div>`
              }

            </div>

          </div>

        `;

      }).join("");

  }

  catch(error){

    console.error(error);

    document.getElementById("clubs").innerHTML = "";

    document.getElementById("error").innerHTML = `
      <div class="error">
        <strong>Dashboard error</strong><br>
        ${escapeHTML(
          error.message ||
          "Something went wrong loading Supabase."
        )}
      </div>
    `;

  }

}


/* =========================================
   START
========================================= */

loadDashboard();

</script>

</body>
</html>
